name: Publik build (usage telemetry v1)

# Builds the unsigned apps for a Publik release. The Mac apps are signed, notarized and
# stapled outside CI. This workflow uploads workflow artifacts only: it never creates,
# changes or publishes a release.
on:
  push:
    branches:
      - 'telemetry/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publik-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
    env:
      GHOST_TARGET_PLATFORM: ${{ matrix.platform }}
      GHOST_TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch }}
      - name: Verify native runtime architecture
        run: node -e "if(process.platform!==process.env.GHOST_TARGET_PLATFORM || process.arch!==process.env.GHOST_TARGET_ARCH) throw new Error('Build host architecture does not match target')"
      - name: Install locked npm dependencies
        run: npm ci
      - name: Prepare bundled phone runtimes
        run: npm run runtime:prepare
        env:
          GHOST_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Test adapters and sidecar
        run: npm test

      # macOS: the unsigned .app only. The dmg and zip are made after signing.
      - name: Build unsigned Mac app
        if: matrix.platform == 'darwin'
        run: |
          npm run pack -- --publish never --${{ matrix.arch }}
          APP="$(ls -d release/mac*/Ghost.app | head -1)"
          test -d "$APP"
          ditto -c -k --keepParent "$APP" "Ghost-mac-${{ matrix.arch }}-unsigned-app.zip"
          echo "GHOST_APP=$APP" >> "$GITHUB_ENV"
      - name: Check usage telemetry in the packaged Mac app
        if: matrix.platform == 'darwin'
        run: |
          node .github/scripts/publik-telemetry-smoke.mjs "$GHOST_APP/Contents/MacOS/Ghost"
          "$GHOST_APP/Contents/Resources/adb/darwin-${{ matrix.arch }}/adb" kill-server || true
      - name: Upload unsigned Mac app
        if: ${{ !cancelled() && matrix.platform == 'darwin' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghost-mac-${{ matrix.arch }}-unsigned-app
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: Ghost-mac-${{ matrix.arch }}-unsigned-app.zip

      # Windows: the normal unsigned NSIS installer, then a silent install and a telemetry check.
      - name: Build unsigned Windows installer
        if: matrix.platform == 'win32'
        run: npm run dist -- --publish never --${{ matrix.arch }}
      - name: Install silently and check usage telemetry
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release\Ghost-*-win-x64.exe | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'ghost-install'
          $setup = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "The installer ended with exit code $($setup.ExitCode)." }
          $exe = Join-Path $target 'Ghost.exe'
          if (-not (Test-Path $exe)) { $exe = Join-Path $env:LOCALAPPDATA 'Programs\Ghost\Ghost.exe' }
          if (-not (Test-Path $exe)) { throw 'The silent install did not produce Ghost.exe.' }
          Write-Host "Installed: $exe"
          node .github/scripts/publik-telemetry-smoke.mjs $exe
          $result = $LASTEXITCODE
          $adb = Join-Path (Split-Path $exe) 'resources\adb\win32-x64\adb.exe'
          if (Test-Path $adb) { & $adb kill-server 2>$null }
          exit $result
      - name: Upload unsigned Windows installer
        if: ${{ !cancelled() && matrix.platform == 'win32' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghost-win-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: release/*.exe
